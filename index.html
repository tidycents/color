<head>
<meta charset="utf-8">

<title>TidyCents Color · Color on your phone or tablet</title>
<meta name="description" content="Color TidyCents coloring books with your finger on a phone, tablet or computer. Works offline after the first download.">

<meta name="theme-color" content="#173F31">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TC Color">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
/* Layout: app shell. Library (code box + book grid) → book (page grid) → studio (drawing + tools). */
:root{
  --green:#173F31;--green2:#1f5341;--cream:#F6F1E4;--gold:#C9A25E;--paper:#ffffff;--bg:#F3EEE6;--ink:#22201E;--muted:#6b665e;--line:#E4DACA;--accent:#E8742C;
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{--bg:#121a17;--paper:#1b2622;--ink:#eef2ee;--muted:#a7b3ad;--line:#2c3a34}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font:15px/1.45 var(--font);background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--green);color:var(--cream);
  padding:calc(8px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.top .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:inherit;text-decoration:none;min-width:0}
.top .brand img{width:30px;height:30px;border-radius:8px}
.top .brand span{color:var(--gold)}
.top .title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.top .sp{flex:1}
.ib{border:0;background:transparent;color:var(--cream);border-radius:10px;min-width:40px;min-height:40px;display:grid;place-items:center;cursor:pointer;font-weight:700;font-size:14px;padding:0 8px}
.ib svg{width:22px;height:22px}
.lang{display:flex;border:1px solid var(--gold);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;color:var(--cream);font:700 12px var(--font);padding:5px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--green)}
.wrap{max-width:1100px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
body{overflow-x:hidden}.wrap>*{min-width:0}
h1{font-size:clamp(22px,5vw,30px);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0}
.lead{margin:6px 0 0;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}
.codebox{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.codebox form{display:flex;gap:8px;flex-wrap:wrap}
.codebox input{flex:1 1 200px;min-width:0;font:600 17px var(--font);letter-spacing:.06em;text-transform:uppercase;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.btn{border:0;border-radius:12px;background:var(--green);color:var(--cream);font:700 15px var(--font);padding:11px 16px;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.gold{background:var(--gold);color:var(--green)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.orange{background:var(--accent);color:#fff}
.btn:disabled{opacity:.5}
.msg{font-size:13px;min-height:18px;margin:0}
.msg.err{color:#c0392b}.msg.ok{color:#1f7a4d}
.install{display:grid;gap:6px;background:color-mix(in srgb,var(--gold) 18%,var(--paper));border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.install p{margin:0;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bk{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;cursor:pointer;text-align:left;padding:0;color:inherit}
.bk img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee;display:block}
.bk .bd{padding:8px 10px;display:grid;gap:4px;align-content:start}
.bk b{font-size:13px;line-height:1.25}
.bk small{font-size:11.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;width:max-content}
.chip.off{background:#dff3e8;color:#16603d}.chip.free{background:#fff1d6;color:#7a5410}.chip.lock{background:var(--bg);color:var(--muted)}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.pgb{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;display:grid;gap:4px;color:#22201E}
.pgb img{width:100%;aspect-ratio:1/1.15;object-fit:contain;background:#fff;display:block}
.pgb span{font-size:12px;font-weight:700;text-align:center}
.pgb.lockd{opacity:.5}
.bookhead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.bookhead img{width:110px;border-radius:12px;border:1px solid var(--line)}
.bookhead .info{flex:1 1 220px;display:grid;gap:8px;min-width:0}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--green)}
/* studio */
.studio{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg);z-index:10}
.stage{min-height:0;overflow:auto;display:flex;padding:8px}
.board{position:relative;touch-action:none;margin:auto;flex:0 0 auto;box-shadow:0 2px 10px rgba(0,0,0,.12);border-radius:6px;background:#fff}
.board.move{touch-action:pan-x pan-y pinch-zoom;cursor:grab}
.board canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px}
#lines{pointer-events:none}
.tray{display:grid;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:var(--paper);border-top:1px solid var(--line)}
.tools{display:flex;gap:4px;align-items:center;overflow-x:auto;background:var(--green);border-radius:14px;padding:5px}
.tool{border:0;border-radius:10px;background:transparent;color:var(--cream);font:700 12.5px var(--font);padding:7px 9px;display:flex;align-items:center;gap:5px;cursor:pointer;min-height:40px;flex:0 0 auto}
.tool svg{width:21px;height:21px;flex:0 0 auto}
.tool[aria-pressed="true"]{background:var(--cream);color:var(--green)}
.tool:disabled{opacity:.4}
.tool.armed{background:#e63946;color:#fff}
.size{display:flex;align-items:center;gap:6px;color:var(--cream);flex:0 0 auto;padding:0 4px}
.size input{width:80px;accent-color:var(--gold)}
.sep{width:1px;align-self:stretch;background:rgba(246,241,228,.25);margin:0 2px;flex:0 0 auto}
.palette{display:flex;gap:7px;overflow-x:auto;padding:3px 2px 4px;align-items:center}
.sw{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink);transform:scale(1.08)}
.custom{position:relative;flex:0 0 auto;width:36px;height:36px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.custom input{position:absolute;inset:-8px;width:60px;height:60px;opacity:0;cursor:pointer;border:0;padding:0}
.hint{font-size:11.5px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;max-width:90vw;text-align:center}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px;z-index:40}
.sheet .card{max-width:min(520px,100%);max-height:90%;overflow:auto;display:grid;gap:10px}
.sheet img{width:100%;border-radius:10px;border:1px solid var(--line)}
@media (min-width:900px){.tray .tool span{display:inline}}
@media (max-width:640px){.tool span{display:none}.size .lbl{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="app"></div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<div class="sheet" id="sheet" hidden><div class="card"><p id="sheet-msg" style="margin:0"></p><img id="sheet-img" alt=""><button class="btn line" id="sheet-close" type="button"></button></div></div>

        if(sy<H-1){var v=k+W;if(!mask[v]&&!seen[v]){if(!dn){st.push(cx,sy+1);dn=true}}else dn=false}}}
    for(var k2=0;k2<W*H;k2++){if(mask[k2]&&!seen[k2]){var col=k2%W;if((col>0&&seen[k2-1])||(col<W-1&&seen[k2+1])||(k2>=W&&seen[k2-W])||(k2<W*H-W&&seen[k2+W])){var j2=k2*4;d[j2]=c[0];d[j2+1]=c[1];d[j2+2]=c[2];d[j2+3]=255}}}
    pctx.putImageData(im,0,0);sched()}
  function pos(e){var r=paint.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left)*W/r.width),y:Math.floor((e.clientY-r.top)*H/r.height)}}
  var drawing=false,last=null,aid=null;
  board.onpointerdown=function(e){if(S.tool==="move"||aid!==null)return;var p=pos(e);if(p.x<0||p.y<0||p.x>=W||p.y>=H)return;
    if(S.tool==="fill"){fillAt(p.x,p.y);return}aid=e.pointerId;try{board.setPointerCapture(aid)}catch(x){}drawing=true;snap();last=p;stroke(p,p)};
  board.onpointermove=function(e){if(!drawing||e.pointerId!==aid)return;var ev=e.getCoalescedEvents?e.getCoalescedEvents():[e];if(!ev.length)ev=[e];ev.forEach(function(q){var p=pos(q);stroke(last,p);last=p})};
  board.onpointerup=board.onpointercancel=function(e){if(e.pointerId!==aid)return;drawing=false;aid=null;last=null;sched()};
  function stroke(a,c){var s=+$("size").value*W/paint.getBoundingClientRect().width;pctx.lineCap="round";pctx.lineJoin="round";pctx.lineWidth=Math.max(2,s);pctx.strokeStyle=S.tool==="erase"?"#ffffff":S.color;pctx.beginPath();pctx.moveTo(a.x+.5,a.y+.5);pctx.lineTo(c.x+.5,c.y+.5);pctx.stroke()}
  $("undo").onclick=function(){var s=undoStack.pop();if(s){pctx.putImageData(s,0,0);sched()}$("undo").disabled=!undoStack.length};
  $("zIn").onclick=function(){zoom=Math.min(3,zoom+.5);fit()};$("zOut").onclick=function(){zoom=Math.max(1,zoom-.5);fit()};
  $("clear").onclick=function(){var el=$("clear");if(!clearArmed){clearArmed=true;el.classList.add("armed");toast(t("clear2"));setTimeout(function(){clearArmed=false;el.classList.remove("armed")},3000);return}
    clearArmed=false;el.classList.remove("armed");snap();pctx.fillStyle="#fff";pctx.fillRect(0,0,W,H);sched()};
  $("pPrev").onclick=function(){flush();go(curPage-1)};$("pNext").onclick=function(){flush();go(curPage+1)};
  function go(i){if(i<0||i>=b.pages.length)return;if(!dirOf(b)&&i>0){toast(t("lockPage"));return}location.hash="page-"+b.id+"-"+(i+1)}
  $("save").onclick=function(){flush();var o=document.createElement("canvas");o.width=W;o.height=H;var x=o.getContext("2d");x.drawImage(paint,0,0);x.drawImage(lines,0,0);
    o.toBlob(function(bl){var name="TidyCents_"+b.id+"_"+(curPage+1)+".png",file;try{file=new File([bl],name,{type:"image/png"})}catch(e){}
      if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).then(function(){toast(t("saved"))}).catch(function(err){if(!err||err.name!=="AbortError")sheet(o)});return}
      if(isIOS()){sheet(o);return}
      var a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);toast(t("saved"))},"image/png")};
}
function sheet(c){$("sheet-msg").textContent=t("longpress");$("sheet-img").src=c.toDataURL("image/png");$("sheet-close").textContent=t("close");$("sheet").hidden=false}
$("sheet-close").onclick=function(){$("sheet").hidden=true};
document.addEventListener("visibilitychange",function(){if(document.hidden&&S.flush)S.flush()});
/* ---------- router ---------- */
function render(){
  document.documentElement.lang=LANG;
  var h=location.hash.slice(1),m;
  if(S.flush){S.flush();S.flush=null}
  if((m=h.match(/^page-([a-z0-9]+)-(\d+)$/))){curBook=bookById(m[1]);curPage=(+m[2])-1;if(curBook&&curPage>=0&&curPage<curBook.pages.length&&(dirOf(curBook)||curPage===0))return renderStudio()}
  if((m=h.match(/^book-([a-z0-9]+)$/))){curBook=bookById(m[1]);if(curBook)return renderBook()}
  renderLib();
}
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0)});
window.addEventListener("online",function(){if(view==="lib")render()});window.addEventListener("offline",function(){if(view==="lib")render()});
fetch("books.json").then(function(r){return r.json()}).then(function(j){BOOKS=j;render()}).catch(function(){app.innerHTML='<main class="wrap"><p>'+t("dlfail")+'</p></main>'});
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
